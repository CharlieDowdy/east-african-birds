<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="theme-color" content="#123b2a">
<title>East African Birds</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f5ef;
  color:#152019;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
  background:#123b2a;
  color:white;
  padding:28px 18px 24px;
  border-radius:0 0 30px 30px;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:6px 0 0;
  opacity:.85;
}

main{
  max-width:1150px;
  margin:auto;
  padding:16px;
}

.search{
  width:100%;
  padding:16px;
  border:0;
  border-radius:16px;
  font-size:16px;
  box-shadow:0 3px 16px #0001;
  outline:none;
}

.bar{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:13px 0;
}

.chip{
  border:1px solid #d5ddd5;
  background:white;
  border-radius:99px;
  padding:9px 14px;
  white-space:nowrap;
  cursor:pointer;
}

.chip.on{
  background:#123b2a;
  color:white;
}

.stats{
  display:flex;
  gap:9px;
  margin-bottom:16px;
}

.stat{
  background:white;
  border-radius:15px;
  padding:13px;
  flex:1;
  box-shadow:0 3px 12px #0001;
}

.stat b{
  display:block;
  font-size:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:14px;
}

.card{
  background:white;
  border-radius:20px;
  padding:14px;
  box-shadow:0 4px 16px #0001;
  overflow:hidden;
}

.thumb{
  height:175px;
  border-radius:15px;
  overflow:hidden;
  background:#dfe9df;
  display:grid;
  place-items:center;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.placeholder{
  font-size:52px;
}

.card h2{
  font-size:19px;
  margin:12px 0 3px;
}

.sci{
  font-style:italic;
  color:#68736b;
  font-size:13px;
}

.tag{
  display:inline-block;
  background:#eef3ee;
  border-radius:8px;
  padding:5px 8px;
  margin:7px 3px 0 0;
  font-size:11px;
}

.status{
  background:#f5e0dc;
}

.btn{
  border:0;
  border-radius:11px;
  padding:10px 14px;
  background:#123b2a;
  color:white;
  font-weight:600;
  margin-top:11px;
  cursor:pointer;
}

.btn.secondary{
  background:#e8eee8;
  color:#123b2a;
}

.modal{
  position:fixed;
  inset:0;
  background:#0009;
  display:none;
  align-items:flex-end;
  z-index:100;
}

.sheet{
  background:white;
  width:100%;
  max-width:850px;
  margin:auto;
  border-radius:25px 25px 0 0;
  padding:22px;
  max-height:94vh;
  overflow:auto;
}

.x{
  float:right;
  border:0;
  border-radius:50%;
  width:36px;
  height:36px;
  font-size:22px;
  cursor:pointer;
}

.detailHero{
  margin-top:8px;
}

.detailHero h1{
  margin-bottom:4px;
}

.section{
  margin-top:25px;
}

.section h2{
  margin-bottom:10px;
  color:#123b2a;
}

.photoGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
  gap:10px;
}

.photoBox{
  background:#eef3ee;
  border-radius:15px;
  overflow:hidden;
}

.photoBox img{
  width:100%;
  height:190px;
  object-fit:cover;
  display:block;
}

.credit{
  font-size:11px;
  color:#59645d;
  padding:8px;
  line-height:1.35;
}

.noPhoto{
  background:#eef3ee;
  border-radius:14px;
  padding:18px;
  color:#59645d;
}

.infoGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:9px;
}

.info{
  background:#eef3ee;
  padding:12px;
  border-radius:13px;
}

.info b{
  display:block;
  font-size:12px;
  color:#68736b;
  margin-bottom:4px;
}

.lifeList{
  display:none;
}

.lifeCard{
  background:white;
  padding:15px;
  border-radius:17px;
  margin-bottom:10px;
  box-shadow:0 3px 12px #0001;
}

.empty{
  text-align:center;
  padding:50px 20px;
  color:#68736b;
}

.tabs{
  position:sticky;
  bottom:9px;
  background:white;
  border-radius:18px;
  padding:7px;
  display:flex;
  justify-content:space-around;
  box-shadow:0 5px 24px #0002;
  margin-top:24px;
}

.tabs button{
  border:0;
  background:none;
  padding:10px;
  font-weight:600;
  color:#123b2a;
  cursor:pointer;
}

@media(max-width:600px){

  .stats{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .stat:last-child{
    grid-column:1 / -1;
  }

  .sheet{
    max-height:96vh;
  }

  .photoGrid{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>🦜 East African Birds</h1>
  <p>Explore • Learn • Record</p>
</header>

<main>

<div id="explore">

  <input
    id="q"
    class="search"
    placeholder="Search bird, scientific name, family..."
    autocomplete="off"
  >

  <div id="bar" class="bar"></div>

  <div class="stats">
    <div class="stat">
      <b id="loaded">0</b>
      species
    </div>

    <div class="stat">
      <b>1,851</b>
      Avibase listed
    </div>

    <div class="stat">
      <b id="photoCount">—</b>
      photo records
    </div>
  </div>

  <div id="grid" class="grid"></div>

</div>


<div id="lifeList" class="lifeList">

  <h2>⭐ My Life List</h2>

  <p>
    Keep track of the East African birds you've recorded.
  </p>

  <div id="lifeGrid"></div>

</div>


<div class="tabs">
  <button onclick="showExplore()">🔎 Explore</button>
  <button onclick="showLife()">⭐ Life List</button>
  <button onclick="about()">ℹ️ About</button>
</div>

</main>


<div id="modal" class="modal">

  <div class="sheet">

    <button
      class="x"
      onclick="closeModal()"
    >×</button>

    <div id="detail"></div>

  </div>

</div>


<script>

let birds = [];
let photos = {};
let family = "All";

const q = document.getElementById("q");
const bar = document.getElementById("bar");
const grid = document.getElementById("grid");
const loaded = document.getElementById("loaded");
const photoCount = document.getElementById("photoCount");
const modal = document.getElementById("modal");
const detail = document.getElementById("detail");


// ============================================================
// LOAD DATABASES
// ============================================================

Promise.all([
  fetch("data/species.json").then(r => r.json()),
  fetch("data/photos.json").then(r => r.json())
])
.then(([speciesData, photoData]) => {

  birds = speciesData.species || [];

  photos = photoData.species || {};

  loaded.textContent = birds.length;

  let total = 0;

  Object.values(photos).forEach(p => {

    if (!p) return;

    ["male","female","juvenile","general"].forEach(type => {

      if (Array.isArray(p[type])) {
        total += p[type].length;
      }

    });

  });

  photoCount.textContent = total;

  render();

})
.catch(error => {

  console.error(error);

  grid.innerHTML = `
    <div class="empty">
      <h2>Unable to load the bird database</h2>
      <p>Please try refreshing the page.</p>
    </div>
  `;

});


// ============================================================
// SEARCH
// ============================================================

q.addEventListener("input", render);


// ============================================================
// RENDER
// ============================================================

function render(){

  const query =
    q.value
      .toLowerCase()
      .trim();

  const families = [
    "All",
    ...new Set(
      birds
        .map(x => x.family)
        .filter(Boolean)
    )
  ];

  bar.innerHTML =
    families.map(f => {

      const safe =
        String(f)
          .replace(/'/g,"\\'");

      return `
        <button
          class="chip ${f === family ? "on" : ""}"
          onclick="setFamily('${safe}')"
        >
          ${escapeHTML(f)}
        </button>
      `;

    }).join("");


  const list =
    birds.filter(x => {

      const familyMatch =
        family === "All" ||
        x.family === family;

      const text =
        `${x.name || ""}
         ${x.scientific || ""}
         ${x.family || ""}
         ${x.order || ""}`
        .toLowerCase();

      return familyMatch &&
        text.includes(query);

    });


  if (!list.length){

    grid.innerHTML = `
      <div class="empty">
        <h2>No birds found</h2>
        <p>Try another search.</p>
      </div>
    `;

    return;
  }


  grid.innerHTML =
    list.map(birdCard).join("");

}


// ============================================================
// FAMILY FILTER
// ============================================================

function setFamily(value){

  family = value;

  render();

}


// ============================================================
// BIRD CARD
// ============================================================

function birdCard(x){

  const p =
    photos[x.id];

  const image =
    firstPhoto(p);

  const imageHTML =
    image
      ? `
        <img
          src="${escapeAttr(image.url)}"
          alt="${escapeAttr(x.name)}"
          loading="lazy"
        >
      `
      : `
        <div class="placeholder">
          🐦
        </div>
      `;


  return `
    <article class="card">

      <div class="thumb">
        ${imageHTML}
      </div>

      <h2>
        ${escapeHTML(x.name || "Unknown")}
      </h2>

      <div class="sci">
        ${escapeHTML(x.scientific || "")}
      </div>

      ${
        x.family
          ? `
            <span class="tag">
              ${escapeHTML(x.family)}
            </span>
          `
          : ""
      }

      ${
        x.status
          ? `
            <span class="tag status">
              ${escapeHTML(formatStatus(x.status))}
            </span>
          `
          : ""
      }

      <br>

      <button
        class="btn"
        onclick="openBird('${escapeAttr(x.id)}')"
      >
        View species
      </button>

    </article>
  `;

}


// ============================================================
// FIRST PHOTO
// ============================================================

function firstPhoto(p){

  if (!p) return null;

  const order = [
    "male",
    "female",
    "general",
    "juvenile"
  ];

  for (const type of order){

    if (
      Array.isArray(p[type]) &&
      p[type].length
    ){

      return p[type][0];

    }

  }

  return null;

}


// ============================================================
// OPEN SPECIES
// ============================================================

function openBird(id){

  const bird =
    birds.find(
      x => x.id === id
    );

  if (!bird) return;


  const p =
    photos[id] || {};


  const male =
    Array.isArray(p.male)
      ? p.male
      : [];


  const female =
    Array.isArray(p.female)
      ? p.female
      : [];


  const juvenile =
    Array.isArray(p.juvenile)
      ? p.juvenile
      : [];


  const general =
    Array.isArray(p.general)
      ? p.general
      : [];


  detail.innerHTML = `

    <div class="detailHero">

      <h1>
        ${escapeHTML(bird.name || "Unknown")}
      </h1>

      <p class="sci">
        ${escapeHTML(bird.scientific || "")}
      </p>

      <div class="infoGrid">

        <div class="info">
          <b>Order</b>
          ${escapeHTML(bird.order || "Not recorded")}
        </div>

        <div class="info">
          <b>Family</b>
          ${escapeHTML(bird.family || "Not recorded")}
        </div>

        <div class="info">
          <b>Conservation status</b>
          ${escapeHTML(
            formatStatus(
              bird.status ||
              "Not recorded"
            )
          )}
        </div>

        <div class="info">
          <b>Region</b>
          Eastern Africa
        </div>

      </div>

    </div>


    ${photoSection(
      "♂ Male",
      "Male",
      male
    )}


    ${photoSection(
      "♀ Female",
      "Female",
      female
    )}


    ${photoSection(
      "🐣 Juvenile",
      "Juvenile",
      juvenile
    )}


    ${photoSection(
      "📷 Additional photographs",
      "Additional",
      general
    )}


    <div class="section">

      <h2>Species information</h2>

      <div class="infoGrid">

        <div class="info">
          <b>Scientific name</b>
          <i>
            ${escapeHTML(
              bird.scientific || "Unknown"
            )}
          </i>
        </div>

        <div class="info">
          <b>Species ID</b>
          ${escapeHTML(
            bird.id || "Unknown"
          )}
        </div>

      </div>

    </div>


    <div class="section">

      <button
        class="btn"
        onclick="addLife('${escapeAttr(bird.id)}')"
      >
        ⭐ Add to Life List
      </button>

      <button
        class="btn secondary"
        onclick="closeModal()"
      >
        Close
      </button>

    </div>

  `;


  modal.style.display = "flex";

}


// ============================================================
// PHOTO SECTION
// ============================================================

function photoSection(
  title,
  label,
  photosList
){

  if (
    !photosList ||
    !photosList.length
  ){

    return `
      <div class="section">

        <h2>${title}</h2>

        <div class="noPhoto">
          No suitable ${label.toLowerCase()}
          photograph was found.
        </div>

      </div>
    `;

  }


  return `
    <div class="section">

      <h2>${title}</h2>

      <div class="photoGrid">

        ${
          photosList
            .map(photoHTML)
            .join("")
        }

      </div>

    </div>
  `;

}


// ============================================================
// PHOTO HTML
// ============================================================

function photoHTML(p){

  if (!p || !p.url) return "";

  const provider =
    p.provider ||
    "Photo source";

  const licence =
    p.license ||
    "Licence not supplied";

  const artist =
    p.artist ||
    "Photographer not supplied";


  return `
    <div class="photoBox">

      <img
        src="${escapeAttr(p.url)}"
        alt="Bird photograph"
        loading="lazy"
      >

      <div class="credit">

        <b>${escapeHTML(provider)}</b>
        <br>

        ${escapeHTML(artist)}
        <br>

        Licence:
        ${escapeHTML(licence)}

      </div>

    </div>
  `;

}


// ============================================================
// LIFE LIST
// ============================================================

function addLife(id){

  let list =
    JSON.parse(
      localStorage.getItem("life")
      || "[]"
    );


  if (!list.includes(id)){

    list.push(id);

    localStorage.setItem(
      "life",
      JSON.stringify(list)
    );

    alert(
      "Added to your Life List ⭐"
    );

  }else{

    alert(
      "This bird is already on your Life List."
    );

  }

}


function showLife(){

  document.getElementById(
    "explore"
  ).style.display = "none";

  document.getElementById(
    "lifeList"
  ).style.display = "block";


  const list =
    JSON.parse(
      localStorage.getItem("life")
      || "[]"
    );


  const container =
    document.getElementById(
      "lifeGrid"
    );


  if (!list.length){

    container.innerHTML = `
      <div class="empty">

        <h2>Your Life List is empty</h2>

        <p>
          Open a species and press
          "Add to Life List" when you
          record a bird.
        </p>

      </div>
    `;

    return;

  }


  const saved =
    birds.filter(
      bird =>
        list.includes(bird.id)
    );


  container.innerHTML =
    saved.map(bird => {

      const p =
        photos[bird.id];

      const image =
        firstPhoto(p);


      return `
        <div class="lifeCard">

          ${
            image
              ? `
                <img
                  src="${escapeAttr(image.url)}"
                  style="
                    width:100%;
                    height:170px;
                    object-fit:cover;
                    border-radius:13px;
                  "
                >
              `
              : ""
          }

          <h3>
            ${escapeHTML(bird.name)}
          </h3>

          <div class="sci">
            ${escapeHTML(
              bird.scientific || ""
            )}
          </div>

          <button
            class="btn"
            onclick="openBird('${escapeAttr(bird.id)}')"
          >
            View species
          </button>

        </div>
      `;

    }).join("");

}


function showExplore(){

  document.getElementById(
    "explore"
  ).style.display = "block";

  document.getElementById(
    "lifeList"
  ).style.display = "none";

}


// ============================================================
// ABOUT
// ============================================================

function about(){

  alert(
`East African Birds

A field-guide style database for birds of Eastern Africa.

Bird database:
Avibase Eastern Africa checklist
Clements 2025 taxonomy

Photographs:
Wikimedia Commons
iNaturalist

Only photographs with the supported open licences are included.

The app does not use AI identification.`
  );

}


// ============================================================
// MODAL
// ============================================================

function closeModal(){

  modal.style.display = "none";

}


modal.addEventListener(
  "click",
  function(event){

    if (
      event.target === modal
    ){

      closeModal();

    }

  }
);


// ============================================================
// HELPERS
// ============================================================

function formatStatus(status){

  if (!status) return "";

  return String(status)
    .replaceAll("_"," ")
    .replace(/\b\w/g,
      c => c.toUpperCase()
    );

}


function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function escapeAttr(value){

  return escapeHTML(value);

}

</script>

</body>
</html>
