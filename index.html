<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#123b2a">
<title>East African Birds</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f5ef;
  color:#152019;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
  background:#123b2a;
  color:white;
  padding:28px 18px 25px;
  border-radius:0 0 30px 30px;
}

header h1{
  margin:0;
  font-size:30px;
}

header p{
  margin:7px 0 0;
  opacity:.86;
}

.scope{
  margin-top:15px;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.scope span{
  background:#ffffff18;
  border:1px solid #ffffff25;
  border-radius:99px;
  padding:6px 10px;
  font-size:12px;
}

main{
  max-width:1150px;
  margin:auto;
  padding:16px;
}

.search{
  width:100%;
  padding:16px;
  border:0;
  border-radius:16px;
  font-size:16px;
  box-shadow:0 3px 16px #0001;
  outline:none;
}

.filterTitle{
  font-weight:700;
  margin-top:17px;
  margin-bottom:7px;
  color:#123b2a;
}

.bar{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:8px 0 13px;
}

.chip{
  border:1px solid #d5ddd5;
  background:white;
  border-radius:99px;
  padding:9px 14px;
  white-space:nowrap;
  cursor:pointer;
  font-size:14px;
}

.chip.on{
  background:#123b2a;
  color:white;
  border-color:#123b2a;
}

.stats{
  display:flex;
  gap:9px;
  margin-bottom:16px;
}

.stat{
  background:white;
  border-radius:15px;
  padding:13px;
  flex:1;
  box-shadow:0 3px 12px #0001;
}

.stat b{
  display:block;
  font-size:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:14px;
}

.card{
  background:white;
  border-radius:20px;
  padding:14px;
  box-shadow:0 4px 16px #0001;
  overflow:hidden;
}

.thumb{
  height:190px;
  border-radius:15px;
  overflow:hidden;
  background:#dfe9df;
  display:grid;
  place-items:center;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.placeholder{
  font-size:52px;
}

.card h2{
  font-size:19px;
  margin:12px 0 3px;
}

.sci{
  font-style:italic;
  color:#68736b;
  font-size:13px;
}

.tag{
  display:inline-block;
  background:#eef3ee;
  border-radius:8px;
  padding:5px 8px;
  margin:7px 3px 0 0;
  font-size:11px;
}

.status{
  background:#f5e0dc;
}

.countryTags{
  margin-top:5px;
}

.countryTag{
  display:inline-block;
  font-size:11px;
  margin:5px 3px 0 0;
  padding:5px 8px;
  border-radius:8px;
  background:#e5efe8;
}

.btn{
  border:0;
  border-radius:11px;
  padding:10px 14px;
  background:#123b2a;
  color:white;
  font-weight:600;
  margin-top:11px;
  cursor:pointer;
}

.btn.secondary{
  background:#e8eee8;
  color:#123b2a;
}

.modal{
  position:fixed;
  inset:0;
  background:#0009;
  display:none;
  align-items:flex-end;
  z-index:100;
}

.sheet{
  background:white;
  width:100%;
  max-width:900px;
  margin:auto;
  border-radius:25px 25px 0 0;
  padding:22px;
  max-height:94vh;
  overflow:auto;
}

.x{
  float:right;
  border:0;
  border-radius:50%;
  width:36px;
  height:36px;
  font-size:22px;
  cursor:pointer;
}

.detailHero h1{
  margin-bottom:4px;
}

.section{
  margin-top:25px;
}

.section h2{
  margin-bottom:10px;
  color:#123b2a;
}

.photoGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
}

.photoBox{
  background:#eef3ee;
  border-radius:15px;
  overflow:hidden;
}

.photoBox img{
  width:100%;
  height:auto;
  max-height:600px;
  object-fit:contain;
  display:block;
  background:#eef3ee;
}

.credit{
  font-size:11px;
  color:#59645d;
  padding:9px;
  line-height:1.4;
}

.noPhoto{
  background:#eef3ee;
  border-radius:14px;
  padding:18px;
  color:#59645d;
}

.infoGrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
  gap:9px;
}

.info{
  background:#eef3ee;
  padding:12px;
  border-radius:13px;
}

.info b{
  display:block;
  font-size:12px;
  color:#68736b;
  margin-bottom:4px;
}

.lifeList{
  display:none;
}

.lifeCard{
  background:white;
  padding:15px;
  border-radius:17px;
  margin-bottom:10px;
  box-shadow:0 3px 12px #0001;
}

.tabs{
  position:sticky;
  bottom:9px;
  background:white;
  border-radius:18px;
  padding:7px;
  display:flex;
  justify-content:space-around;
  box-shadow:0 5px 24px #0002;
  margin-top:24px;
}

.tabs button{
  border:0;
  background:none;
  padding:10px;
  font-weight:600;
  color:#123b2a;
  cursor:pointer;
}

.empty{
  text-align:center;
  padding:50px 20px;
  color:#68736b;
}

@media(max-width:600px){

  .stats{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .stat:last-child{
    grid-column:1/-1;
  }

  .sheet{
    max-height:96vh;
    padding:18px;
  }

  .photoGrid{
    grid-template-columns:1fr;
  }

  .photoBox img{
    max-height:none;
  }
}
</style>
</head>

<body>

<header>

  <h1>🦜 East African Birds</h1>

  <p>
    A field guide to the birds of Kenya, Tanzania, Uganda & Ethiopia
  </p>

  <div class="scope">
    <span>🇰🇪 Kenya</span>
    <span>🇹🇿 Tanzania</span>
    <span>🇺🇬 Uganda</span>
    <span>🇪🇹 Ethiopia</span>
  </div>

</header>


<main>

<div id="explore">

  <input
    id="q"
    class="search"
    placeholder="Search bird, scientific name or family..."
    autocomplete="off"
  >


  <div class="filterTitle">
    🌍 Country
  </div>

  <div id="countryBar" class="bar"></div>


  <div class="filterTitle">
    🐦 Family
  </div>

  <div id="familyBar" class="bar"></div>


  <div class="stats">

    <div class="stat">
      <b id="loaded">0</b>
      species
    </div>

    <div class="stat">
      <b id="visible">0</b>
      shown
    </div>

    <div class="stat">
      <b id="photoCount">—</b>
      photographs
    </div>

  </div>


  <div id="grid" class="grid"></div>

</div>


<div id="lifeList" class="lifeList">

  <h2>⭐ My Life List</h2>

  <p>
    Keep track of the East African birds you've recorded.
  </p>

  <div id="lifeGrid"></div>

</div>


<div class="tabs">

  <button onclick="showExplore()">
    🔎 Explore
  </button>

  <button onclick="showLife()">
    ⭐ Life List
  </button>

  <button onclick="about()">
    ℹ️ About
  </button>

</div>

</main>


<div id="modal" class="modal">

  <div class="sheet">

    <button class="x" onclick="closeModal()">×</button>

    <div id="detail"></div>

  </div>

</div>


<script>

let birds = [];
let photos = {};
let details = {};

let family = "All";
let country = "All";


const q =
  document.getElementById("q");

const familyBar =
  document.getElementById("familyBar");

const countryBar =
  document.getElementById("countryBar");

const grid =
  document.getElementById("grid");

const loaded =
  document.getElementById("loaded");

const visible =
  document.getElementById("visible");

const photoCount =
  document.getElementById("photoCount");

const modal =
  document.getElementById("modal");

const detail =
  document.getElementById("detail");


// ============================================================
// ONLY THESE FOUR COUNTRIES
// ============================================================

const countries = [

  {
    code:"KE",
    name:"🇰🇪 Kenya"
  },

  {
    code:"TZ",
    name:"🇹🇿 Tanzania"
  },

  {
    code:"UG",
    name:"🇺🇬 Uganda"
  },

  {
    code:"ET",
    name:"🇪🇹 Ethiopia"
  }

];


// ============================================================
// LOAD DATABASES
// ============================================================

Promise.all([

  fetch("data/species.json")
    .then(r => r.json()),

  fetch("data/photos.json")
    .then(r => r.json()),

  fetch("data/species_details.json")
    .then(r => r.json())

])

.then(([speciesData, photoData, detailData]) => {

  birds =
    speciesData.species || [];

  photos =
    photoData.species || {};

  details =
    detailData.species || {};


  loaded.textContent =
    birds.length;


  let total = 0;


  Object.values(photos)
    .forEach(p => {

      if (!p) return;


      [
        "male",
        "female",
        "juvenile",
        "general",
        "additional"

      ].forEach(type => {

        if (
          Array.isArray(p[type])
        ){

          total +=
            p[type].length;

        }

      });

    });


  photoCount.textContent =
    total;


  render();

})

.catch(error => {

  console.error(error);

  grid.innerHTML = `

    <div class="empty">

      <h2>
        Unable to load the bird database
      </h2>

      <p>
        Please refresh the page.
      </p>

    </div>

  `;

});


q.addEventListener(
  "input",
  render
);


// ============================================================
// COUNTRY FILTER
// ============================================================

function renderCountries(){

  countryBar.innerHTML = `

    <button
      class="chip ${
        country === "All"
          ? "on"
          : ""
      }"
      onclick="setCountry('All')"
    >
      🌍 All four countries
    </button>

    ${
      countries
        .map(c => `

          <button
            class="chip ${
              country === c.code
                ? "on"
                : ""
            }"
            onclick="setCountry('${c.code}')"
          >
            ${c.name}
          </button>

        `)
        .join("")
    }

  `;

}


function setCountry(code){

  country = code;

  render();

}


// ============================================================
// CHECK COUNTRY
// ============================================================

function birdIsInScope(bird){

  const d =
    details[bird.id];


  if (
    !d ||
    !Array.isArray(
      d.countries
    )
  ){

    return false;

  }


  return d.countries.some(
    code =>
      countries.some(
        c => c.code === code
      )
  );

}


function birdIsInCountry(bird){

  const d =
    details[bird.id];


  if (
    !d ||
    !Array.isArray(
      d.countries
    )
  ){

    return false;

  }


  if (country === "All"){

    return birdIsInScope(
      bird
    );

  }


  return d.countries.includes(
    country
  );

}


// ============================================================
// RENDER
// ============================================================

function render(){

  renderCountries();


  const families = [

    "All",

    ...new Set(

      birds
        .filter(
          bird =>
            birdIsInScope(bird)
        )
        .map(
          bird =>
            bird.family
        )
        .filter(Boolean)

    )

  ];


  familyBar.innerHTML =
    families
      .map(f => `

        <button
          class="chip ${
            f === family
              ? "on"
              : ""
          }"
          onclick="setFamily(
            ${JSON.stringify(f)}
          )"
        >
          ${escapeHTML(f)}
        </button>

      `)
      .join("");


  const query =
    q.value
      .toLowerCase()
      .trim();


  const list =
    birds.filter(bird => {

      if (
        !birdIsInCountry(
          bird
        )
      ){

        return false;

      }


      const familyMatch =
        family === "All" ||
        bird.family === family;


      const text =
        `${bird.name || ""}
         ${bird.scientific || ""}
         ${bird.family || ""}
         ${bird.order || ""}`
        .toLowerCase();


      const searchMatch =
        text.includes(query);


      return (
        familyMatch &&
        searchMatch
      );

    });


  visible.textContent =
    list.length;


  if (!list.length){

    grid.innerHTML = `

      <div class="empty">

        <h2>
          No birds found
        </h2>

        <p>
          No species match
          these filters.
        </p>

        <button
          class="btn"
          onclick="clearFilters()"
        >
          Clear filters
        </button>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    list
      .map(birdCard)
      .join("");

}


// ============================================================
// FAMILY
// ============================================================

function setFamily(value){

  family = value;

  render();

}


// ============================================================
// CLEAR
// ============================================================

function clearFilters(){

  family = "All";

  country = "All";

  q.value = "";

  render();

}


// ============================================================
// BIRD CARD
// ============================================================

function birdCard(bird){

  const p =
    photos[bird.id];


  const image =
    firstPhoto(p);


  const d =
    details[bird.id] || {};


  const imageHTML =
    image

      ? `

        <img
          src="${escapeAttr(
            image.url
          )}"
          alt="${escapeAttr(
            bird.name
          )}"
          loading="lazy"
        >

      `

      : `

        <div class="placeholder">
          🐦
        </div>

      `;


  const birdCountries =
    Array.isArray(
      d.countries
    )
      ? d.countries
          .filter(
            code =>
              countries.some(
                c =>
                  c.code === code
              )
          )
      : [];


  const countryHTML =
    birdCountries
      .map(code => {

        const c =
          countries.find(
            x =>
              x.code === code
          );


        return c
          ? `<span class="countryTag">
               ${c.name}
             </span>`
          : "";

      })
      .join("");


  return `

    <article class="card">

      <div class="thumb">
        ${imageHTML}
      </div>


      <h2>
        ${escapeHTML(
          bird.name ||
          "Unknown"
        )}
      </h2>


      <div class="sci">
        ${escapeHTML(
          bird.scientific ||
          ""
        )}
      </div>


      ${
        bird.family

          ? `

            <span class="tag">
              ${escapeHTML(
                bird.family
              )}
            </span>

          `

          : ""
      }


      ${
        d.conservation_status

          ? `

            <span class="tag status">
              ${escapeHTML(
                formatStatus(
                  d.conservation_status
                )
              )}
            </span>

          `

          : ""
      }


      <div class="countryTags">
        ${countryHTML}
      </div>


      <button
        class="btn"
        onclick="openBird(
          '${escapeAttr(bird.id)}'
        )"
      >
        View species
      </button>

    </article>

  `;

}


// ============================================================
// PHOTO
// ============================================================

function firstPhoto(p){

  if (!p) return null;


  const order = [

    "male",
    "female",
    "juvenile",
    "additional",
    "general"

  ];


  for (
    const type of order
  ){

    if (
      Array.isArray(
        p[type]
      ) &&
      p[type].length
    ){

      return p[type][0];

    }

  }


  return null;

}


// ============================================================
// SPECIES PAGE
// ============================================================

function openBird(id){

  const bird =
    birds.find(
      x => x.id === id
    );


  if (!bird) return;


  const p =
    photos[id] || {};


  const d =
    details[id] || {};


  const male =
    Array.isArray(p.male)
      ? p.male
      : [];


  const female =
    Array.isArray(p.female)
      ? p.female
      : [];


  const juvenile =
    Array.isArray(p.juvenile)
      ? p.juvenile
      : [];


  let additional = [];


  if (
    Array.isArray(
      p.additional
    )
  ){

    additional =
      p.additional;

  }
  else if (
    Array.isArray(
      p.general
    )
  ){

    additional =
      p.general;

  }


  const birdCountries =
    Array.isArray(
      d.countries
    )
      ? d.countries
          .map(code => {

            const c =
              countries.find(
                x =>
                  x.code === code
              );

            return c
              ? c.name
              : null;

          })
          .filter(Boolean)
      : [];


  detail.innerHTML = `

    <div class="detailHero">

      <h1>
        ${escapeHTML(
          bird.name ||
          "Unknown"
        )}
      </h1>


      <p class="sci">
        ${escapeHTML(
          bird.scientific ||
          ""
        )}
      </p>


      <div class="infoGrid">

        <div class="info">

          <b>Order</b>

          ${escapeHTML(
            bird.order ||
            "Not recorded"
          )}

        </div>


        <div class="info">

          <b>Family</b>

          ${escapeHTML(
            bird.family ||
            "Not recorded"
          )}

        </div>


        <div class="info">

          <b>Conservation status</b>

          ${escapeHTML(
            formatStatus(
              d.conservation_status ||
              "Not recorded"
            )
          )}

        </div>


        <div class="info">

          <b>Countries</b>

          ${
            birdCountries.length
              ? birdCountries.join(
                  ", "
                )
              : "Not recorded"
          }

        </div>

      </div>

    </div>


    ${photoSection(
      "♂ Male",
      "male",
      male
    )}


    ${photoSection(
      "♀ Female",
      "female",
      female
    )}


    ${photoSection(
      "🐣 Juvenile",
      "juvenile",
      juvenile
    )}


    ${photoSection(
      "📷 Additional photographs",
      "additional",
      additional
    )}


    <div class="section">

      <h2>
        Species information
      </h2>


      <div class="infoGrid">

        <div class="info">

          <b>Scientific name</b>

          <i>
            ${escapeHTML(
              bird.scientific ||
              "Unknown"
            )}
          </i>

        </div>


        ${
          d.habitat

            ? `

              <div class="info">

                <b>Habitat</b>

                ${escapeHTML(
                  d.habitat
                )}

              </div>

            `

            : ""
        }

      </div>

    </div>


    <div class="section">

      <button
        class="btn"
        onclick="addLife(
          '${escapeAttr(
            bird.id
          )}'
        )"
      >
        ⭐ Add to Life List
      </button>


      <button
        class="btn secondary"
        onclick="closeModal()"
      >
        Close
      </button>

    </div>

  `;


  modal.style.display =
    "flex";

}


// ============================================================
// PHOTO SECTION
// ============================================================

function photoSection(
  title,
  type,
  photosList
){

  if (
    !photosList ||
    !photosList.length
  ){

    return `

      <div class="section">

        <h2>
          ${title}
        </h2>

        <div class="noPhoto">
          No suitable ${type}
          photograph was found.
        </div>

      </div>

    `;

  }


  return `

    <div class="section">

      <h2>
        ${title}
      </h2>


      <div class="photoGrid">

        ${
          photosList
            .map(photoHTML)
            .join("")
        }

      </div>

    </div>

  `;

}


// ============================================================
// PHOTO HTML
// ============================================================

function photoHTML(p){

  if (
    !p ||
    !p.url
  ){

    return "";

  }


  const provider =
    p.provider ||
    "Photo source";


  const licence =
    p.license ||
    p.license_code ||
    "Licence not supplied";


  const artist =
    p.artist ||
    p.attribution ||
    "Photographer not supplied";


  return `

    <div class="photoBox">

      <img
        src="${escapeAttr(
          p.url
        )}"
        alt="Bird photograph"
        loading="lazy"
      >


      <div class="credit">

        <b>
          ${escapeHTML(
            provider
          )}
        </b>

        <br>

        ${escapeHTML(
          artist
        )}

        <br>

        Licence:
        ${escapeHTML(
          licence
        )}

      </div>

    </div>

  `;

}


// ============================================================
// LIFE LIST
// ============================================================

function addLife(id){

  let list =
    JSON.parse(
      localStorage.getItem(
        "life"
      ) || "[]"
    );


  if (
    !list.includes(id)
  ){

    list.push(id);

    localStorage.setItem(
      "life",
      JSON.stringify(list)
    );

    alert(
      "Added to your Life List ⭐"
    );

  }
  else{

    alert(
      "This bird is already on your Life List."
    );

  }

}


function showLife(){

  document.getElementById(
    "explore"
  ).style.display =
    "none";


  document.getElementById(
    "lifeList"
  ).style.display =
    "block";


  const list =
    JSON.parse(
      localStorage.getItem(
        "life"
      ) || "[]"
    );


  const container =
    document.getElementById(
      "lifeGrid"
    );


  if (!list.length){

    container.innerHTML = `

      <div class="empty">

        <h2>
          Your Life List is empty
        </h2>

        <p>
          Open a species and press
          "Add to Life List" when you
          record a bird.
        </p>

      </div>

    `;

    return;

  }


  const saved =
    birds.filter(
      bird =>
        list.includes(
          bird.id
        )
    );


  container.innerHTML =
    saved
      .map(bird => {

        const p =
          photos[
            bird.id
          ];


        const image =
          firstPhoto(p);


        return `

          <div class="lifeCard">

            ${
              image

                ? `

                  <img
                    src="${escapeAttr(
                      image.url
                    )}"
                    style="
                      width:100%;
                      height:auto;
                      max-height:400px;
                      object-fit:contain;
                      border-radius:13px;
                    "
                  >

                `

                : ""
            }


            <h3>
              ${escapeHTML(
                bird.name
              )}
            </h3>


            <div class="sci">

              ${escapeHTML(
                bird.scientific ||
                ""
              )}

            </div>


            <button
              class="btn"
              onclick="openBird(
                '${escapeAttr(
                  bird.id
                )}'
              )"
            >
              View species
            </button>

          </div>

        `;

      })
      .join("");

}


function showExplore(){

  document.getElementById(
    "explore"
  ).style.display =
    "block";


  document.getElementById(
    "lifeList"
  ).style.display =
    "none";

}

function closeModal(){

  modal.style.display =
    "none";

}


modal.addEventListener(
  "click",
  function(event){

    if (
      event.target === modal
    ){

      closeModal();

    }

  }
);


// ============================================================
// HELPERS
// ============================================================

function formatStatus(status){

  if (!status)
    return "";


  return String(status)
    .replaceAll(
      "_",
      " "
    )
    .replace(
      /\b\w/g,
      c =>
        c.toUpperCase()
    );

}


function escapeHTML(value){

  return String(
    value ?? ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeAttr(value){

  return escapeHTML(
    value
  );

}
