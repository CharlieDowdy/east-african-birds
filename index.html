<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta name="theme-color" content="#0d422f">
<meta name="description" content="East African Birds — a field guide to birds of Eastern Africa">

<title>East African Birds</title>

<style>
*{
  box-sizing:border-box;
}

:root{
  --green:#0d422f;
  --green2:#14583f;
  --light:#f3f7f2;
  --card:#ffffff;
  --text:#142019;
  --muted:#68756d;
  --border:#dce6df;
  --soft:#eaf2ec;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--light);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

/* HEADER */

header{
  background:linear-gradient(135deg,#0d422f,#176044);
  color:white;
  padding:28px 18px 34px;
  border-radius:0 0 30px 30px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-icon{
  font-size:38px;
}

h1{
  margin:0;
  font-size:30px;
  letter-spacing:-.5px;
}

header p{
  margin:7px 0 0;
  opacity:.85;
}

/* MAIN */

main{
  max-width:1100px;
  margin:auto;
  padding:18px;
}

/* SEARCH */

.search-wrap{
  margin-top:-8px;
  position:relative;
  z-index:2;
}

.search{
  width:100%;
  padding:17px 18px;
  border:0;
  border-radius:17px;
  background:white;
  box-shadow:0 6px 25px #00000012;
  outline:none;
  font-size:16px;
}

.search:focus{
  box-shadow:0 0 0 3px #0d422f22,0 6px 25px #00000012;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin:18px 0;
}

.stat{
  background:white;
  border:1px solid var(--border);
  border-radius:17px;
  padding:16px;
}

.stat b{
  display:block;
  color:var(--green);
  font-size:24px;
  margin-bottom:3px;
}

/* FAMILY BAR */

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin:24px 0 12px;
}

.section-title h2{
  margin:0;
  font-size:22px;
}

.family-bar{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:3px 0 12px;
  scrollbar-width:thin;
}

.family{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:white;
  color:#1160c9;
  border-radius:999px;
  padding:10px 14px;
  white-space:nowrap;
}

.family.active{
  background:var(--green);
  color:white;
  border-color:var(--green);
}

/* CONTROLS */

.controls{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin:20px 0 13px;
}

.controls h2{
  margin:0;
  font-size:22px;
}

select{
  border:1px solid var(--border);
  background:white;
  border-radius:12px;
  padding:10px 13px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(245px,1fr));
  gap:15px;
}

.card{
  background:white;
  border-radius:20px;
  overflow:hidden;
  border:1px solid var(--border);
  box-shadow:0 4px 18px #0000000a;
  transition:.18s ease;
}

.card:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 25px #00000012;
}

.thumb{
  height:190px;
  background:#dfece2;
  position:relative;
  overflow:hidden;
}

.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.no-photo{
  height:100%;
  display:grid;
  place-items:center;
  font-size:58px;
}

.photo-count{
  position:absolute;
  right:10px;
  bottom:10px;
  background:#0009;
  color:white;
  border-radius:999px;
  padding:6px 9px;
  font-size:12px;
}

.card-body{
  padding:16px;
}

.card h3{
  margin:0 0 4px;
  font-size:19px;
}

.scientific{
  color:var(--muted);
  font-size:13px;
  font-style:italic;
}

.tags{
  margin-top:9px;
}

.tag{
  display:inline-block;
  background:var(--soft);
  border-radius:8px;
  padding:6px 8px;
  margin:3px 3px 0 0;
  font-size:11px;
}

.tag.status{
  background:#f4e4de;
}

.view{
  width:100%;
  border:0;
  border-radius:12px;
  background:var(--green);
  color:white;
  font-weight:700;
  padding:11px;
  margin-top:12px;
}

.view:hover{
  background:var(--green2);
}

/* EMPTY */

.empty{
  background:white;
  border:1px solid var(--border);
  border-radius:18px;
  padding:35px 20px;
  text-align:center;
  color:var(--muted);
}

/* BOTTOM NAV */

.nav{
  position:sticky;
  bottom:12px;
  z-index:10;
  margin:25px auto 5px;
  background:#ffffffee;
  backdrop-filter:blur(12px);
  border:1px solid var(--border);
  border-radius:20px;
  padding:7px;
  display:flex;
  justify-content:space-around;
  box-shadow:0 8px 30px #00000018;
}

.nav button{
  border:0;
  background:none;
  color:var(--green);
  font-weight:700;
  padding:11px 20px;
  border-radius:13px;
}

.nav button.active{
  background:var(--soft);
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:#0009;
  z-index:100;
  display:none;
  align-items:flex-end;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.sheet{
  width:100%;
  max-width:850px;
  max-height:94vh;
  overflow:auto;
  background:white;
  border-radius:27px 27px 0 0;
  padding:22px;
  animation:up .2s ease;
}

@keyframes up{
  from{
    transform:translateY(30px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

.close{
  float:right;
  border:0;
  background:#edf1ee;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:22px;
}

.detail-head{
  padding-right:48px;
}

.detail-head h2{
  margin:4px 0 5px;
  font-size:28px;
}

.detail-meta{
  color:var(--muted);
  font-style:italic;
}

.detail-info{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin:15px 0;
}

.info{
  background:var(--soft);
  border-radius:9px;
  padding:8px 10px;
  font-size:13px;
}

.photos{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

.photo-card{
  background:#f5f7f5;
  border-radius:15px;
  overflow:hidden;
}

.photo-card img{
  display:block;
  width:100%;
  height:260px;
  object-fit:cover;
}

.photo-credit{
  padding:10px;
  font-size:11px;
  line-height:1.45;
  color:#59645d;
}

.photo-credit a{
  color:#1262c4;
}

.life-btn{
  border:0;
  border-radius:13px;
  background:var(--green);
  color:white;
  padding:13px 16px;
  font-weight:700;
  margin-top:16px;
}

.life-btn.saved{
  background:#597465;
}

/* LIFE LIST */

.life-list{
  display:grid;
  gap:10px;
}

.life-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  background:white;
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
}

.life-item button{
  border:0;
  background:#f2e6e2;
  border-radius:9px;
  padding:8px 10px;
}

/* ABOUT */

.about{
  line-height:1.6;
}

.about a{
  color:#1262c4;
}

/* LOADING */

.loading{
  padding:30px;
  text-align:center;
  color:var(--muted);
}

/* MOBILE */

@media(max-width:650px){

  .stats{
    grid-template-columns:1fr 1fr 1fr;
  }

  .stat{
    padding:12px;
  }

  .stat b{
    font-size:20px;
  }

  .grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .thumb{
    height:145px;
  }

  .card-body{
    padding:12px;
  }

  .card h3{
    font-size:16px;
  }

  .scientific{
    font-size:11px;
  }

  .photos{
    grid-template-columns:1fr;
  }

  .photo-card img{
    height:240px;
  }
}

@media(max-width:430px){

  .grid{
    grid-template-columns:1fr;
  }

  .thumb{
    height:210px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      <div class="logo-icon">🦜</div>

      <div>
        <h1>East African Birds</h1>
        <p>Explore • Learn • Record</p>
      </div>
    </div>

  </div>
</header>

<main>

  <div class="search-wrap">
    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search bird, scientific name or family…"
      autocomplete="off"
    >
  </div>

  <div class="stats">

    <div class="stat">
      <b id="speciesCount">—</b>
      Bird species
    </div>

    <div class="stat">
      <b id="familyCount">—</b>
      Families
    </div>

    <div class="stat">
      <b id="lifeCount">0</b>
      Life List
    </div>

  </div>

  <div class="section-title">
    <h2>Browse families</h2>
  </div>

  <div id="families" class="family-bar"></div>

  <div class="controls">

    <h2 id="resultsTitle">Birds</h2>

    <select id="sort">
      <option value="az">A–Z</option>
      <option value="za">Z–A</option>
      <option value="family">Family</option>
      <option value="status">Conservation status</option>
    </select>

  </div>

  <div id="grid" class="grid">
    <div class="loading">Loading birds…</div>
  </div>

  <div class="nav">

    <button
      id="exploreBtn"
      class="active"
      onclick="showExplore()"
    >
      🔎 Explore
    </button>

    <button onclick="showLifeList()">
      ⭐ Life List
    </button>

    <button onclick="showAbout()">
      ℹ️ About
    </button>

  </div>

</main>

<!-- SPECIES MODAL -->

<div id="modal" class="modal">

  <div class="sheet">

    <button
      class="close"
      onclick="closeModal()"
      aria-label="Close"
    >
      ×
    </button>

    <div id="detail"></div>

  </div>

</div>

<script>

let birds = [];
let photos = {};
let selectedFamily = "All";
let currentView = "explore";

const searchInput =
  document.getElementById("search");

const familyContainer =
  document.getElementById("families");

const grid =
  document.getElementById("grid");

const sortSelect =
  document.getElementById("sort");

const modal =
  document.getElementById("modal");

const detail =
  document.getElementById("detail");

const speciesCount =
  document.getElementById("speciesCount");

const familyCount =
  document.getElementById("familyCount");

const lifeCount =
  document.getElementById("lifeCount");

const resultsTitle =
  document.getElementById("resultsTitle");


/* ---------------------------
   LOAD DATABASES
--------------------------- */

async function loadData(){

  try{

    const [
      speciesResponse,
      photosResponse
    ] = await Promise.all([

      fetch("data/species.json"),

      fetch("data/photos.json")

    ]);

    if(!speciesResponse.ok){
      throw new Error(
        "Could not load species.json"
      );
    }

    if(!photosResponse.ok){
      throw new Error(
        "Could not load photos.json"
      );
    }

    const speciesData =
      await speciesResponse.json();

    const photosData =
      await photosResponse.json();

    birds =
      Array.isArray(speciesData.species)
        ? speciesData.species
        : [];

    photos =
      photosData.species || {};

    updateStats();

    renderFamilies();

    render();

  }catch(error){

    console.error(error);

    grid.innerHTML = `
      <div class="empty">
        <h3>Unable to load the bird database</h3>
        <p>${escapeHtml(error.message)}</p>
      </div>
    `;

  }

}


/* ---------------------------
   STATS
--------------------------- */

function updateStats(){

  const families =
    new Set(
      birds
        .map(b => b.family)
        .filter(Boolean)
    );

  speciesCount.textContent =
    birds.length.toLocaleString();

  familyCount.textContent =
    families.size;

  updateLifeCount();

}


/* ---------------------------
   LIFE LIST
--------------------------- */

function getLifeList(){

  try{

    return JSON.parse(
      localStorage.getItem("eastAfricanBirdLifeList")
      || "[]"
    );

  }catch{

    return [];

  }

}

function saveLifeList(list){

  localStorage.setItem(
    "eastAfricanBirdLifeList",
    JSON.stringify(list)
  );

  updateLifeCount();

}

function updateLifeCount(){

  lifeCount.textContent =
    getLifeList().length;

}

function isInLifeList(id){

  return getLifeList().includes(id);

}

function toggleLife(id){

  const list =
    getLifeList();

  const index =
    list.indexOf(id);

  if(index === -1){

    list.push(id);

  }else{

    list.splice(index,1);

  }

  saveLifeList(list);

  openBird(id);

}


/* ---------------------------
   FAMILIES
--------------------------- */

function renderFamilies(){

  const familySet =
    new Set(
      birds
        .map(b => b.family)
        .filter(Boolean)
    );

  const families =
    Array.from(familySet)
      .sort((a,b) =>
        a.localeCompare(b)
      );

  familyContainer.innerHTML = [

    `<button
      class="family ${selectedFamily === "All" ? "active" : ""}"
      onclick="selectFamily('All')"
    >
      All
    </button>`,

    ...families.map(f => `

      <button
        class="family ${selectedFamily === f ? "active" : ""}"
        onclick='selectFamily(${JSON.stringify(f)})'
      >
        ${escapeHtml(f)}
      </button>

    `)

  ].join("");

}


function selectFamily(family){

  selectedFamily =
    family;

  renderFamilies();

  render();

}


/* ---------------------------
   FILTER + SORT
--------------------------- */

function getFilteredBirds(){

  const query =
    searchInput.value
      .trim()
      .toLowerCase();

  let list =
    birds.filter(b => {

      const familyMatch =
        selectedFamily === "All"
        || b.family === selectedFamily;

      const text = [

        b.name,
        b.scientific,
        b.family,
        b.order,
        b.status

      ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

      return (
        familyMatch
        && text.includes(query)
      );

    });

  const sort =
    sortSelect.value;

  if(sort === "az"){

    list.sort((a,b) =>
      (a.name || "").localeCompare(
        b.name || ""
      )
    );

  }

  if(sort === "za"){

    list.sort((a,b) =>
      (b.name || "").localeCompare(
        a.name || ""
      )
    );

  }

  if(sort === "family"){

    list.sort((a,b) =>
      (
        a.family || ""
      ).localeCompare(
        b.family || ""
      )
      ||
      (
        a.name || ""
      ).localeCompare(
        b.name || ""
      )
    );

  }

  if(sort === "status"){

    list.sort((a,b) =>
      (
        a.status || "Unknown"
      ).localeCompare(
        b.status || "Unknown"
      )
    );

  }

  return list;

}


/* ---------------------------
   RENDER BIRD CARDS
--------------------------- */

function render(){

  if(currentView !== "explore"){
    return;
  }

  const list =
    getFilteredBirds();

  resultsTitle.textContent =
    `${list.length.toLocaleString()} birds`;

  if(!list.length){

    grid.innerHTML = `
      <div class="empty">
        <h3>No birds found</h3>
        <p>Try a different search or family.</p>
      </div>
    `;

    return;

  }

  grid.innerHTML =
    list.map(birdCard).join("");

}


/* ---------------------------
   BIRD CARD
--------------------------- */

function birdCard(bird){

  const birdPhotos =
    getBirdPhotos(bird.id);

  const firstPhoto =
    birdPhotos[0];

  const image =
    firstPhoto
      ? `
        <img
          src="${escapeAttr(firstPhoto.url)}"
          alt="${escapeAttr(bird.name)}"
          loading="lazy"
          onerror="this.parentElement.innerHTML='<div class=no-photo>🐦</div>'"
        >
      `
      : `
        <div class="no-photo">
          🐦
        </div>
      `;

  const count =
    birdPhotos.length
      ? `
        <div class="photo-count">
          📷 ${birdPhotos.length}
        </div>
      `
      : "";

  const status =
    bird.status
      ? `
        <span class="tag status">
          ${escapeHtml(formatStatus(bird.status))}
        </span>
      `
      : "";

  return `

    <article class="card">

      <div class="thumb">

        ${image}

        ${count}

      </div>

      <div class="card-body">

        <h3>
          ${escapeHtml(bird.name || "Unknown")}
        </h3>

        <div class="scientific">
          ${escapeHtml(bird.scientific || "")}
        </div>

        <div class="tags">

          ${
            bird.family
              ? `
                <span class="tag">
                  ${escapeHtml(bird.family)}
                </span>
              `
              : ""
          }

          ${status}

        </div>

        <button
          class="view"
          onclick='openBird(${JSON.stringify(bird.id)})'
        >
          View species
        </button>

      </div>

    </article>

  `;

}


/* ---------------------------
   GET PHOTOS
--------------------------- */

function getBirdPhotos(id){

  const result =
    photos[id];

  return Array.isArray(result)
    ? result
    : [];

}


/* ---------------------------
   SPECIES PAGE
--------------------------- */

function openBird(id){

  const bird =
    birds.find(
      b => b.id === id
    );

  if(!bird){
    return;
  }

  const birdPhotos =
    getBirdPhotos(id);

  const saved =
    isInLifeList(id);

  const photosHtml =
    birdPhotos.length

      ? `
        <div class="photos">

          ${birdPhotos.map(
            photo => photoHtml(
              photo,
              bird.name
            )
          ).join("")}

        </div>
      `

      : `
        <div class="empty">
          No photos available yet.
        </div>
      `;

  detail.innerHTML = `

    <div class="detail-head">

      <h2>
        ${escapeHtml(bird.name || "Unknown")}
      </h2>

      <div class="detail-meta">
        ${escapeHtml(bird.scientific || "")}
      </div>

    </div>

    <div class="detail-info">

      ${
        bird.order
          ? `
            <div class="info">
              <b>Order:</b>
              ${escapeHtml(bird.order)}
            </div>
          `
          : ""
      }

      ${
        bird.family
          ? `
            <div class="info">
              <b>Family:</b>
              ${escapeHtml(bird.family)}
            </div>
          `
          : ""
      }

      ${
        bird.status
          ? `
            <div class="info">
              <b>Status:</b>
              ${escapeHtml(formatStatus(bird.status))}
            </div>
          `
          : ""
      }

    </div>

    <h3>
      Photos
    </h3>

    ${photosHtml}

    <button
      class="life-btn ${saved ? "saved" : ""}"
      onclick='toggleLife(${JSON.stringify(id)})'
    >
      ${saved
        ? "✓ Remove from Life List"
        : "⭐ Add to Life List"}
    </button>

  `;

  modal.classList.add("show");

  document.body.style.overflow =
    "hidden";

}


function photoHtml(photo,birdName){

  const artist =
    cleanArtist(
      photo.artist
    );

  const license =
    photo.license
      || "See source";

  return `

    <div class="photo-card">

      <img
        src="${escapeAttr(photo.url || "")}"
        alt="${escapeAttr(birdName)}"
        loading="lazy"
        onerror="this.style.display='none'"
      >

      <div class="photo-credit">

        <strong>
          ${escapeHtml(artist || "Unknown photographer")}
        </strong>

        <br>

        ${escapeHtml(license)}

        <br>

        <a
          href="${escapeAttr(photo.source || "#")}"
          target="_blank"
          rel="noopener noreferrer"
        >
          View source on Wikimedia Commons
        </a>

      </div>

    </div>

  `;

}


/* ---------------------------
   CLEAN COMMONS ARTIST HTML
--------------------------- */

function cleanArtist(value){

  if(!value){
    return "";
  }

  const div =
    document.createElement("div");

  div.innerHTML =
    value;

  return (
    div.textContent
    || div.innerText
    || value
  ).replace(
    /\s+/g,
    " "
  ).trim();

}


/* ---------------------------
   STATUS
--------------------------- */

function formatStatus(status){

  return String(status)
    .replaceAll("_"," ")
    .replace(
      /\b\w/g,
      c => c.toUpperCase()
    );

}


/* ---------------------------
   LIFE LIST VIEW
--------------------------- */

function showLifeList(){

  currentView =
    "life";

  document.getElementById(
    "exploreBtn"
  ).classList.remove("active");

  const list =
    getLifeList();

  resultsTitle.textContent =
    `⭐ Life List (${list.length})`;

  familyContainer.innerHTML = "";

  if(!list.length){

    grid.innerHTML = `
      <div class="empty">

        <h3>Your Life List is empty</h3>

        <p>
          Open a species and press
          "Add to Life List" to start
          recording birds you've seen.
        </p>

      </div>
    `;

    return;

  }

  const savedBirds =
    list
      .map(id =>
        birds.find(b => b.id === id)
      )
      .filter(Boolean);

  grid.innerHTML =
    savedBirds
      .map(birdCard)
      .join("");

}


/* ---------------------------
   EXPLORE VIEW
--------------------------- */

function showExplore(){

  currentView =
    "explore";

  selectedFamily =
    "All";

  renderFamilies();

  render();

  document.getElementById(
    "exploreBtn"
  ).classList.add("active");

}

/* ---------------------------
   MODAL
--------------------------- */

function closeModal(){

  modal.classList.remove("show");

  document.body.style.overflow =
    "";

}

modal.addEventListener(
  "click",
  event => {

    if(event.target === modal){
      closeModal();
    }

  }
);

document.addEventListener(
  "keydown",
  event => {

    if(event.key === "Escape"){
      closeModal();
    }

  }
);


/* ---------------------------
   SEARCH / SORT
--------------------------- */

searchInput.addEventListener(
  "input",
  () => {

    if(currentView !== "explore"){
      showExplore();
    }

    render();

  }
);

sortSelect.addEventListener(
  "change",
  render
);


/* ---------------------------
   SECURITY HELPERS
--------------------------- */

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function escapeAttr(value){

  return escapeHtml(value);

}

   START
--------------------------- */

loadData();
