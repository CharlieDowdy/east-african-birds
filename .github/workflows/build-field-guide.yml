name: Build field-guide accounts

on:
  push:
    paths:
      - 'data/species.json'
      - 'data/species_details.json'
      - 'data/photos.json'
      - 'scripts/build_field_guide_accounts.py'
      - 'scripts/build_source_backed_data.py'
      - '.github/workflows/build-field-guide.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build normalised field-guide accounts
        run: python scripts/build_field_guide_accounts.py
      - name: Build source-backed data audit
        run: python scripts/build_source_backed_data.py
      - name: Commit generated account data
        run: |
          if git diff --quiet -- data/field_guide_accounts.json data/field_guide_data.json; then
            echo 'No generated data changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/field_guide_accounts.json data/field_guide_data.json
          git commit -m 'Build source-backed field-guide data'
          git push
