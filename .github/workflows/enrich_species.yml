name: Enrich bird database

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Enrich species database
        run: python scripts/enrich_species.py

      - name: Show database statistics
        run: |
          python - <<'PY'
          import json

          with open(
              "data/species_details.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          species = data.get("species", {})

          with_gbif = sum(
              1 for x in species.values()
              if x.get("gbif_key")
          )

          with_habitat = sum(
              1 for x in species.values()
              if x.get("habitat")
          )

          with_status = sum(
              1 for x in species.values()
              if x.get("conservation_status")
          )

          with_distribution = sum(
              1 for x in species.values()
              if x.get("distribution")
          )

          print(f"Total records: {len(species)}")
          print(f"GBIF matches: {with_gbif}")
          print(f"Habitat records: {with_habitat}")
          print(f"Conservation records: {with_status}")
          print(f"Distribution records: {with_distribution}")
          PY

      - name: Commit enriched database
        run: |
          git config user.name "East African Birds Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/species_details.json

          git diff --cached --quiet || \
            git commit -m "Enrich bird species database"

          git push
