name: Repair bird photo database

on:
  workflow_dispatch:
  push:
    paths:
      - "data/species.json"
      - "scripts/repair_photos.py"
      - ".github/workflows/build_photos.yml"

permissions:
  contents: write

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Replace unreliable photos
        run: python scripts/repair_photos.py

      - name: Show repair statistics
        run: |
          python - <<'PY'
          import json
          with open("data/photo_repair_report.json", encoding="utf-8") as f:
              report = json.load(f)
          print("Species:", report["species_total"])
          print("Replaced with exact-taxonomy photos:", report["replaced"])
          print("No verified replacement:", report["no_verified_replacement"])
          PY

      - name: Commit repaired photo database
        run: |
          git config user.name "East African Birds Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/photos.json data/photo_repair_report.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Replace unverified bird photos with exact species matches"
            git push
          fi
