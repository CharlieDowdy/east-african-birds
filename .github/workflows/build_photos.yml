name: Build bird photo database

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  photos:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Build photo database
        run: |
          python scripts/build_photos.py

      - name: Show photo statistics
        run: |
          python - <<'PY'
          import json

          with open(
              "data/photos.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if "species" in data:
              data = data["species"]

          species = len(data)

          with_photos = sum(
              1
              for photos in data.values()
              if photos
          )

          total = sum(
              len(photos)
              for photos in data.values()
          )

          print(
              "Species processed:",
              species
          )

          print(
              "Species with photos:",
              with_photos
          )

          print(
              "Total photos:",
              total
          )
          PY

      - name: Commit photo database
        run: |

          git config user.name \
            "East African Birds Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/photos.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit \
              -m "Build licensed bird photo database"

            git push
          fi
