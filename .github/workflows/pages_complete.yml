name: Build and deploy East African Birds

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check bird database
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/species.json")

          if not path.exists():
              raise SystemExit("data/species.json does not exist")

          data = json.loads(path.read_text(encoding="utf-8"))

          species = data.get("species", [])

          print(f"Bird database contains {len(species)} species")

          if not species:
              raise SystemExit("No species found in species.json")

          print("Bird database check passed")
          PY

      - name: Bust browser cache for photo database
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import os

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          sha = os.environ["BUILD_SHA"][:12]

          # Any direct reference to data/photos.json gets a unique URL on
          # every deployment, preventing an old photo database from being
          # served from a browser/CDN cache.
          text = re.sub(
              r"data/photos\.json(?:\?[^\"']*)?",
              f"data/photos.json?v={sha}",
              text,
          )

          path.write_text(text, encoding="utf-8")
          print(f"Photo database cache key: {sha}")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
