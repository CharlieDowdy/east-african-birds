name: Build source-backed bird records

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/species.json'
      - 'scripts/build_gbif_source_records.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build GBIF provenance records
        run: python scripts/build_gbif_source_records.py
      - name: Commit generated records
        run: |
          if git diff --quiet -- data/source_records.json; then
            echo 'No source record changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source_records.json
          git commit -m 'Build source-backed bird records'
          git push
